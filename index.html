<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahil Kumar | Data Analyst</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
}

body{
  font-family:Arial,sans-serif;
  background:#05070d;
  color:#fff;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  width:400px;
  height:400px;
  background:#00aaff;
  filter:blur(180px);
  opacity:.12;
  top:-150px;
  left:-150px;
  z-index:-1;
}

/* NAVBAR */

nav{
  position:fixed;
  top:0;
  width:100%;
  padding:20px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(5,7,13,.75);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #172033;
  z-index:1000;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  color:#25bfff;
}

nav a{
  color:#aaa;
  text-decoration:none;
  margin-left:22px;
  font-size:14px;
}

nav a:hover{
  color:#25bfff;
}

/* HERO */

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:100px 7%;
}

.hero-content{
  max-width:900px;
  animation:heroIn 1.2s ease;
}

.status{
  display:inline-block;
  padding:9px 18px;
  border:1px solid #25bfff;
  border-radius:50px;
  color:#25bfff;
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:25px;
}

.hero h1{
  font-size:clamp(50px,12vw,100px);
  line-height:.95;
  margin-bottom:25px;
}

.hero h1 span{
  color:#25bfff;
}

.hero h2{
  font-size:clamp(20px,4vw,32px);
  color:#d8dee9;
  margin-bottom:20px;
}

.hero p{
  color:#8994a8;
  max-width:650px;
  margin:auto;
  font-size:17px;
}

.buttons{
  margin-top:35px;
}

.btn{
  display:inline-block;
  padding:14px 28px;
  margin:6px;
  border-radius:8px;
  text-decoration:none;
  border:1px solid #25bfff;
  color:#fff;
  transition:.3s;
}

.btn.main{
  background:#25bfff;
  color:#001018;
  font-weight:bold;
}

.btn:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 30px rgba(37,191,255,.2);
}

/* GENERAL */

section{
  padding:110px 7%;
}

.heading{
  text-align:center;
  margin-bottom:60px;
}

.heading small{
  color:#25bfff;
  letter-spacing:3px;
}

.heading h2{
  font-size:45px;
  margin-top:8px;
}

/* ABOUT */

.about{
  background:#080c15;
}

.about-card{
  max-width:850px;
  margin:auto;
  padding:35px;
  border:1px solid #172033;
  border-radius:20px;
  background:#0b111e;
}

.about-card p{
  color:#929db0;
  margin-bottom:15px;
  font-size:16px;
}

/* SKILLS */

.skills{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:15px;
  max-width:900px;
  margin:auto;
}

.skill{
  padding:16px 25px;
  background:#0b111e;
  border:1px solid #1c2a40;
  border-radius:12px;
  color:#dbe4ef;
  transition:.3s;
}

.skill:hover{
  transform:translateY(-7px);
  border-color:#25bfff;
}

/* PROJECTS */

.projects{
  background:#080c15;
}

.project-wrap{
  max-width:950px;
  margin:auto;
}

.project{
  min-height:260px;
  display:flex;
  align-items:center;
  gap:35px;
  padding:35px;
  margin-bottom:35px;
  background:linear-gradient(135deg,#0c1423,#080d18);
  border:1px solid #1b2940;
  border-radius:22px;
  transition:.5s;
  opacity:0;
  transform:translateY(60px);
}

.project.show{
  opacity:1;
  transform:translateY(0);
}

.project:hover{
  transform:translateY(-8px);
  border-color:#25bfff;
}

.number{
  font-size:65px;
  font-weight:bold;
  color:#25bfff;
  min-width:100px;
  opacity:.9;
}

.project h3{
  font-size:27px;
  margin-bottom:8px;
}

.tech{
  color:#25bfff;
  font-size:14px;
  margin-bottom:15px;
}

.project p{
  color:#8c98aa;
  margin-bottom:18px;
}

.project a{
  color:#fff;
  text-decoration:none;
  border-bottom:1px solid #25bfff;
  padding-bottom:4px;
}

/* CERTIFICATES */

.cert-grid{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

.cert{
  padding:30px;
  text-align:center;
  background:#0b111e;
  border:1px solid #1b2940;
  border-radius:18px;
}

.cert h3{
  margin-bottom:8px;
}

.cert p{
  color:#25bfff;
}

/* CONTACT */

.contact{
  text-align:center;
  background:#080c15;
}

.contact p{
  color:#929db0;
  margin-bottom:20px;
}

/* FOOTER */

footer{
  text-align:center;
  padding:30px;
  color:#5f6b7e;
  border-top:1px solid #172033;
}

/* ANIMATION */

@keyframes heroIn{
  from{
    opacity:0;
    transform:translateY(35px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:650px){

  nav{
    padding:16px 5%;
  }

  nav .links{
    display:none;
  }

  section{
    padding:90px 5%;
  }

  .heading h2{
    font-size:35px;
  }

  .project{
    gap:15px;
    padding:25px;
    align-items:flex-start;
  }

  .number{
    font-size:40px;
    min-width:55px;
  }

  .project h3{
    font-size:20px;
  }

  .project p{
    font-size:14px;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">SAHIL<span>.</span></div>

  <div class="links">
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<div class="status">AVAILABLE FOR OPPORTUNITIES</div>

<h1>Sahil <span>Kumar</span></h1>
